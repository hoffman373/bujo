[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bujo"
version = "0.1.0"
description = "A bullet journal domain specific language, and a compiler that emits LaTeX, Markdown or JSON."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-2-Clause" }
authors = [{ name = "Dustin Hoffman" }]
keywords = ["bullet-journal", "dsl", "latex", "markdown", "compiler"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bujo = "bujo.cli:main"

[tool.setuptools.packages.find]
include = ["bujo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
